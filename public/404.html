<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11274a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Mission not found | CyberQuest</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;color:#fff;background:radial-gradient(circle at 50% 5%,#1ca4dd3d,transparent 36%),linear-gradient(135deg,#11274a,#2b2b2b 78%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#d2d0cd12 1px,transparent 1px),linear-gradient(90deg,#d2d0cd12 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#0008,transparent 82%)}
    main{position:relative;width:min(100%,560px);padding:clamp(28px,6vw,52px);border:1px solid #1ca4dd88;border-radius:24px;background:#11274ae8;box-shadow:0 25px 80px #0005;text-align:center}
    .emblem{width:68px;height:68px;display:grid;place-items:center;margin:0 auto 24px;border:2px solid #1ca4dd;border-radius:18px;color:#d09640;background:#1ca4dd1c;box-shadow:0 0 0 7px #1ca4dd12;font-size:34px;font-weight:900}
    .eyebrow{margin:0 0 12px;color:#1ca4dd;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(40px,10vw,68px);line-height:1;letter-spacing:-.06em}
    h1 span{color:#d09640}
    p{max-width:38ch;margin:20px auto 30px;color:#d2d0cd;font-size:15px;line-height:1.65}
    a{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:12px 23px;border:1px solid #6bd1fa;border-radius:10px;background:#1ca4dd;color:#11274a;font-weight:800;text-decoration:none;box-shadow:0 6px 0 #0a557a;transition:transform .15s,box-shadow .15s}
    a:hover{transform:translateY(-2px);box-shadow:0 8px 0 #0a557a}
    a:focus-visible{outline:3px solid #d09640;outline-offset:5px}
    small{display:block;margin-top:34px;color:#d2d0cd;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="emblem" aria-hidden="true">⚡</div>
    <div class="eyebrow">Checkpoint missing · Error 404</div>
    <h1>Wrong <span>turn.</span></h1>
    <p>This route is not on the mission map. Head back to the arcade and pick your next challenge.</p>
    <a href="/">Return to CyberQuest <span aria-hidden="true">→</span></a>
    <small>Stay sharp. Keep playing.</small>
  </main>
</body>
</html>
